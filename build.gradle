plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Hypixel"
		url = "https://repo.hypixel.net/repository/Hypixel/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	runs {
		// Real Microsoft account (DevAuth Neo, dev only) against the production server: test on Hypixel.
		client {
			vmArg "-Ddevauth.enabled=1"
		}
		// Offline dev account against a local backend (npm run dev in backend/).
		clientLocal {
			client()
			name "Minecraft Client (local backend)"
			vmArg "-Ddevauth.enabled=0"
			vmArg "-Dpartyfinder.backend=ws://localhost:8765"
		}
	}
	// The client game test must never talk to the production backend.
	runs.matching { it.name == "clientGameTest" }.configureEach {
		vmArg "-Dpartyfinder.backend=ws://127.0.0.1:9"
	}
	splitEnvironmentSourceSets()

	mods {
		"partyfinder" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// ./gradlew runClientGameTest: opens the game and screenshots the party HUD in several setups (src/gametest).
	configureTests {
		createSourceSet = true
		modId = "partyfinder-gametest"
		eula = true
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "net.hypixel:mod-api:${project.hypixel_mod_api_version}"
	localRuntime "maven.modrinth:dev-auth-neo:${project.dev_auth_neo_version}"
}

processResources {
	def props = [
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

// resourcepack-template/ is a complete resource pack holding every overridable asset at its default value, for pack
// makers. Its assets are a copy of the mod's: refresh them with updateResourcePackTemplate, `check` fails when stale.
tasks.register("updateResourcePackTemplate", Sync) {
	group = "build"
	description = "Copies the mod's overridable assets into resourcepack-template/."
	from("src/client/resources/assets/partyfinder") {
		exclude "icon.png"
	}
	into "resourcepack-template/assets/partyfinder"
}

tasks.register("checkResourcePackTemplate") {
	group = "verification"
	description = "Fails when resourcepack-template/ no longer matches the mod's assets."
	def source = layout.projectDirectory.dir("src/client/resources/assets/partyfinder")
	def target = layout.projectDirectory.dir("resourcepack-template/assets/partyfinder")
	inputs.dir(source)
	inputs.dir(target)
	doLast {
		def files = { File root ->
			def found = new TreeMap<String, File>()
			root.eachFileRecurse(groovy.io.FileType.FILES) { found[root.toPath().relativize(it.toPath()).toString().replace('\\', '/')] = it }
			found.remove("icon.png")
			found
		}
		def expected = files(source.asFile)
		def actual = files(target.asFile)
		def stale = (expected.keySet() + actual.keySet()).findAll {
			!expected.containsKey(it) || !actual.containsKey(it) || !Arrays.equals(expected[it].bytes, actual[it].bytes)
		}
		if (!stale.isEmpty()) {
			throw new GradleException("resourcepack-template/ is out of date (${stale.join(', ')}): run ./gradlew updateResourcePackTemplate")
		}
	}
}

// Packets that are not chat commands (container clicks, item use, GUI actions...) can get players banned on Hypixel.
// The mod only sends allowlisted commands (PartyActions) and the official Hypixel Mod API packets (hypixel/): any
// other way of sending something to the server fails the build.
tasks.register("checkOutboundPackets") {
	group = "verification"
	description = "Fails when code outside the allowed files sends packets to the Minecraft server."
	def roots = ["src/client/java", "src/main/java"].collect { layout.projectDirectory.dir(it) }
	roots.each { inputs.dir(it) }
	doLast {
		// pattern -> files (relative to the source root) allowed to contain it
		def rules = [
			(~/\bsendCommand\b/)                                                       : ["fr/bloup/partyfinder/client/PartyActions.java"],
			(~/ClientPlayNetworking\.send|ClientConfigurationNetworking\.send/)        : ["fr/bloup/partyfinder/client/hypixel/HypixelProtocol.java"],
			(~/HypixelModAPI\.getInstance\(\)\.sendPacket|\bServerbound[A-Z]\w*Packet\b/): ["fr/bloup/partyfinder/client/hypixel/ModApiTransport.java"],
			(~/sendUnsignedCommand|sendChat|\bconnection\.send\(|getConnection\(\)\.send\(|\.send\(new /): [],
			(~/\bgameMode\b|MultiPlayerGameMode|handleInventoryMouseClick|handleContainerInput|clickContainer|closeContainer|ServerboundContainer/): [],
		]
		def violations = []
		roots.each { root ->
			root.asFile.eachFileRecurse(groovy.io.FileType.FILES) { file ->
				if (!file.name.endsWith(".java")) return
				def rel = root.asFile.toPath().relativize(file.toPath()).toString().replace('\\', '/')
				file.readLines().eachWithIndex { line, i ->
					rules.each { pattern, allowed ->
						if (line =~ pattern && !allowed.contains(rel)) violations << "${rel}:${i + 1}: ${line.trim()}"
					}
				}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException("Packets sent outside PartyActions / the Hypixel Mod API:\n" + violations.join("\n"))
		}
	}
}

// The backend only accepts the mod's official activities, categories and option values (packs may restyle them and
// change their own launch commands, not invent activities others see). Its copy is generated from activities.json.
def activitiesSource = layout.projectDirectory.file("src/client/resources/assets/partyfinder/partyfinder/activities.json")
def activitiesCatalog = layout.projectDirectory.file("backend/src/activities.json")
def buildActivitiesCatalog = { File source ->
	def catalog = new TreeMap<String, Object>()
	new groovy.json.JsonSlurper().parse(source, "UTF-8").activities.each { activity ->
		def options = new LinkedHashMap<String, Object>()
		(activity.options ?: []).each { option -> options[option.id] = option.values.collect { it.id } }
		catalog[activity.id] = [category: activity.category ?: "misc", options: options]
	}
	groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(catalog)).replace("\r\n", "\n") + "\n"
}

tasks.register("updateBackendActivities") {
	group = "build"
	description = "Writes the backend's activity catalog (ids, categories, option values) from activities.json."
	inputs.file(activitiesSource)
	outputs.file(activitiesCatalog)
	doLast {
		activitiesCatalog.asFile.setText(buildActivitiesCatalog(activitiesSource.asFile), "UTF-8")
	}
}

tasks.register("checkBackendActivities") {
	group = "verification"
	description = "Fails when backend/src/activities.json no longer matches the mod's activities.json."
	inputs.file(activitiesSource)
	inputs.file(activitiesCatalog)
	doLast {
		def expected = buildActivitiesCatalog(activitiesSource.asFile)
		def actual = activitiesCatalog.asFile.exists() ? activitiesCatalog.asFile.getText("UTF-8").replace("\r\n", "\n") : ""
		if (expected != actual) {
			throw new GradleException("backend/src/activities.json is out of date: run ./gradlew updateBackendActivities")
		}
	}
}

tasks.named("check") {
	dependsOn "checkResourcePackTemplate", "checkOutboundPackets", "checkBackendActivities"
}

tasks.register("resourcePackTemplate", Zip) {
	group = "build"
	description = "Zips resourcepack-template/ into a ready-to-install resource pack."
	archiveFileName = "partyfinder-resourcepack-template.zip"
	destinationDirectory = layout.buildDirectory.dir("resourcepack")
	from("resourcepack-template")
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.archives_base_name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
