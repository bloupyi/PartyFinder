plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Hypixel"
		url = "https://repo.hypixel.net/repository/Hypixel/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	runs {
		// Real Microsoft account (DevAuth Neo, dev only) against the production server: test on Hypixel.
		client {
			vmArg "-Ddevauth.enabled=1"
		}
		// Offline dev account against a local backend (npm run dev in backend/).
		clientLocal {
			client()
			name "Minecraft Client (local backend)"
			vmArg "-Ddevauth.enabled=0"
			vmArg "-Dpartyfinder.backend=ws://localhost:8765"
		}
	}
	splitEnvironmentSourceSets()

	mods {
		"partyfinder" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "net.hypixel:mod-api:${project.hypixel_mod_api_version}"
	localRuntime "maven.modrinth:dev-auth-neo:${project.dev_auth_neo_version}"
}

processResources {
	def props = [
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

// resourcepack-template/ is a complete resource pack holding every overridable asset at its default value, for pack
// makers. Its assets are a copy of the mod's: refresh them with updateResourcePackTemplate, `check` fails when stale.
tasks.register("updateResourcePackTemplate", Sync) {
	group = "build"
	description = "Copies the mod's overridable assets into resourcepack-template/."
	from("src/client/resources/assets/partyfinder") {
		exclude "icon.png"
	}
	into "resourcepack-template/assets/partyfinder"
}

tasks.register("checkResourcePackTemplate") {
	group = "verification"
	description = "Fails when resourcepack-template/ no longer matches the mod's assets."
	def source = layout.projectDirectory.dir("src/client/resources/assets/partyfinder")
	def target = layout.projectDirectory.dir("resourcepack-template/assets/partyfinder")
	inputs.dir(source)
	inputs.dir(target)
	doLast {
		def files = { File root ->
			def found = new TreeMap<String, File>()
			root.eachFileRecurse(groovy.io.FileType.FILES) { found[root.toPath().relativize(it.toPath()).toString().replace('\\', '/')] = it }
			found.remove("icon.png")
			found
		}
		def expected = files(source.asFile)
		def actual = files(target.asFile)
		def stale = (expected.keySet() + actual.keySet()).findAll {
			!expected.containsKey(it) || !actual.containsKey(it) || !Arrays.equals(expected[it].bytes, actual[it].bytes)
		}
		if (!stale.isEmpty()) {
			throw new GradleException("resourcepack-template/ is out of date (${stale.join(', ')}): run ./gradlew updateResourcePackTemplate")
		}
	}
}

tasks.named("check") {
	dependsOn "checkResourcePackTemplate"
}

tasks.register("resourcePackTemplate", Zip) {
	group = "build"
	description = "Zips resourcepack-template/ into a ready-to-install resource pack."
	archiveFileName = "partyfinder-resourcepack-template.zip"
	destinationDirectory = layout.buildDirectory.dir("resourcepack")
	from("resourcepack-template")
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.archives_base_name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
